# ============================================================
# GFA burner-control fault texts, chip 22 (Dover) -- companion package
#
# Include NEXT TO a catalog that has the GFA fault history
# (gfa_fehler_01 .. gfa_fehler_20); it adds the texts to those entities:
#
#   packages:
#     heater: !include catalogs/<your-unit>.yaml
#     gfa: !include catalogs/gfa/chip_22.yaml
#
# The chip is the byte your unit reports at 0x7650 (GFA_Kennung): read it
# once with the scan console. The texts differ by chip, and 7 codes mean
# different things on different chips, so use the one your unit reports.
#
# Generated by scripts/gen_catalog.py from Vitosoft (viessmann.errorcode.fa.22.*).
# ============================================================

text_sensor:
  - id: !extend gfa_fehler_01
    codes: &fault_codes
      0x00: "0: Kein Fehler"
      0x01: "1: TB-Übertemperatur"
      0x02: "2: Gasdruckwächter (GDW): Gasdruck nicht vorhanden"
      0x03: "3: Strömungswächter (StrW): Kein Wasserumlauf vorhanden"
      0x04: "4: Keine Flammenbildung"
      0x05: "5: Flammenausfall im Betrieb"
      0x06: "6: TW-Übertemperatur"
      0x07: "7: ATB - Abgastemperatur überschreitet den Grenzwert"
      0x08: "8: ATW - Abgastemperatur überschreitet den Grenzwert"
      0x09: "9: Wasserdruck zu niedrig"
      0x0A: "10: Flammenausfall in der Sicherheitszeit"
      0x0B: "11: Flammenvortäuschung"
      0x0C: "12: Fehler Kesseltemperatursensor"
      0x0D: "13 Fehler Abgastemperatursensor"
      0x0E: "14: Luftdruckwächter (LDW) hat nicht geöffnet"
      0x0F: "15: Luftdruckwächter (LDW) hat nicht geschlossen"
      0x10: "16: Gasdruckschalter (GDS) hat nicht geöffnet"
      0x11: "17: Gasdruckschalter (GDS) hat nicht geschlossen"
      0x12: "18: Wasserdrucksensor defekt"
      0x13: "19: dLP-Sensor defekt (Offset außerhalb Toleranz)"
      0x14: "20: Fehler BV (Flamme nach 30 s noch vorhanden)"
      0x17: "23: Gebläsedrehzahl größer 2 s außerhalb Toleranz"
      0x18: "24: Gebläsedrehzahl nicht erreicht"
      0x1A: "26: Gebläsestillstand nicht erreicht"
      0x1B: "27: Gebläse unterschreitet 80 % der Mindestdrehzahl"
      0x1C: "28: Fehler Mod.-Ventilansteuerung (zu hoher Ruhestrom)"
      0x1D: "29: Rückmeldung Abgasklappe (RMAE) nicht vorhanden"
      0x1E: "30: CRC-Fehler Herstell/Codier-Parameter"
      0x1F: "31: CRC-Fehler Sicherheitsparameter (FAxx/EFxx)"
      0x20: "32: Fehler Spannungsversorgung 24 V"
      0x21: "33: Fehler Spannungsversorgung 230 V"
      0x22: "34: Falscher Codierstecker (Kennung)"
      0x36: "54: Fehler Luftdruckwächter (LDW) in Phase 5/6"
      0x3D: "61: SCOT: Große Io-Signalabweichung"
      0x3E: "62: SCOT: Unzulässige Gasarmaturansteuerung"
      0x3F: "63: SCOT: Systemfehler (elektr. Überwachung)"
      0x40: "64: SCOT: Kalibrationswert überschreitet (untere) Werksgrenzen"
      0x41: "65: SCOT: Kalibrationswert weicht stark von Vorgänger ab"
      0x42: "66: SCOT: Kalibration wurde nicht ausgeführt"
      0x43: "67: SCOT: IO-Basiswert außerhalb der Werksgrenzen"
      0x44: "68: SCOT: GPV-Offsetgrenze (Min/Max-Begrenzung)"
      0x45: "69: SCOT: Adaption nicht durchführbar"
      0x49: "73: SCOT: Kalibrationsfehler, fehlende Wasserströmung"
      0x4A: "74: SCOT: Kalibrationswert überschreitet obere Werksgrenze"
      0x4C: "76: SCOT: Kalibrationsfehler, Kessel-Übertemperatur"
      0x50: "80: Ungültiges Mode-Byte im K1-Telegramm"
      0x55: "85: Flammenausfall dig. FV in Stab.-Zeit, Neustartversuch...."
      0x60: "96: Fehler Entriegelungstaster (Kurzschluss)"
      0x61: "97: Int. Codierung falsch (unzulässig für Betrieb)"
      0x62: "98: Fehler Flammenverstärker (Kurzschluss)"
      0x63: "99: Fehler interner FA"
      0xFF: "255: Fehlermeldung vorhanden (unbekannt/neu??)"
  - id: !extend gfa_fehler_02
    codes: *fault_codes
  - id: !extend gfa_fehler_03
    codes: *fault_codes
  - id: !extend gfa_fehler_04
    codes: *fault_codes
  - id: !extend gfa_fehler_05
    codes: *fault_codes
  - id: !extend gfa_fehler_06
