# ============================================================
# GFA burner-control fault texts, chip 41 (ÖFA) -- companion package
#
# Include NEXT TO a catalog that has the GFA fault history
# (gfa_fehler_01 .. gfa_fehler_20); it adds the texts to those entities:
#
#   packages:
#     heater: !include catalogs/<your-unit>.yaml
#     gfa: !include catalogs/gfa/chip_41.yaml
#
# The hub logs the chip at boot, in its identification line and the
# catalog-finder link ("GFA=0x24 (NEC)", "&gfa=24"; read from 0x7650,
# GFA_Kennung). The texts differ by chip, and 7 codes mean different things
# on different chips, so use the one your unit reports.
#
# Generated by scripts/gen_catalog.py from Vitosoft (viessmann.errorcode.fa.41.*).
# ============================================================

text_sensor:
  - id: !extend gfa_fehler_01
    codes: &fault_codes
      0x00: "0: No fault"
      0x01: "1: Temperature limiter excess temperature"
      0x02: "2: Gas pressure limiter (GPL): Gas pressure not available"
      0x03: "3: Flow limiter (FL): No circulating water available"
      0x04: "4: No flame established"
      0x05: "5: Flame failure during operation"
      0x06: "6: Temperature controller excess temperature"
      0x07: "7: FGTL - flue gas temperature exceeds the limit"
      0x08: "8: FGTL - flue gas temperature exceeds the limit"
      0x09: "9: Balanced flue chimney (Lp does not reach ignition power)"
      0x0A: "10: Flame failure during safety time"
      0x0B: "11: Flame pretence"
      0x0C: "12: Fehler Kesseltemperatursensor"
      0x0D: "13: Fehler Abgastemperatursensor"
      0x0E: "14: Air pressure switch (APS) has not opened"
      0x0F: "15: Air pressure switch (APS) has not closed"
      0x10: "16: Fault, feedback BV2 in phase 1"
      0x11: "17: Fault, feedback BV2"
      0x12: "18: dLP sensor faulty (short circuit)"
      0x13: "19: dLP sensor faulty (offset outside tolerance)"
      0x14: "20: Main valve fault (flame still present after 15 s)"
      0x17: "23: Fan speed more than 2 s outside tolerance"
      0x18: "24: Fan speed not reached"
      0x1A: "26: Fan not at standstill"
      0x1B: "27: Fan at less than 80 % of minimum speed"
      0x1C: "28: Mod. valve control fault (quiescent current too high)"
      0x1D: "29: Oil preheater feedback (RMAE) not available"
      0x1E: "30: CRC fault, manufacturing/coding parameter"
      0x1F: "31: CRC fault, safety parameter (FAxx/EFxx)"
      0x20: "32: 24 V power supply fault"
      0x21: "33: 230 V power supply fault"
      0x22: "34: Incorrect coding card (ID)"
      0x36: "54: Air pressure switch (APS) fault in phase 5/6"
      0x3D: "61: SCOT: Large ionisation signal deviation"
      0x3E: "62: SCOT: Unzulässige Gasarmaturansteuerung"
      0x3F: "63: SCOT: System fault (electr. monitoring)"
      0x40: "64: SCOT: Calibration value exceeds (lower) factory limits"
      0x41: "65: SCOT: Calibration value deviates from predecessor by a large amount"
      0x42: "66: SCOT: Calibration was not carried out"
      0x43: "67: SCOT: Ionisation base value outside factory limits"
      0x44: "68: SCOT: GPV offset limit (min/max limitation)"
      0x45: "69: SCOT: Adaptation cannot be carried out"
      0x49: "73: SCOT: Calibration error, missing water flow"
      0x4A: "74: SCOT: Calibration value exceeds upper factory limit"
      0x4C: "76: SCOT: Calibration error, excessive boiler temperature"
      0x50: "80: Invalid mode byte in K1 telegram"
      0x55: "85: Flammenausfall dig. FV in Stab.-Zeit, Neustartversuch...."
      0x60: "96: Reset button fault (short circuit)"
      0x61: "97: Int. K code incorrect (not permissible for operation)"
      0x62: "98: Flame amplifier fault (short circuit)"
      0x63: "99: Fehler interner FA"
      0xFF: "255: Fehlermeldung vorhanden (unbekannt/neu??)"
  - id: !extend gfa_fehler_02
    codes: *fault_codes
  - id: !extend gfa_fehler_03
    codes: *fault_codes
  - id: !extend gfa_fehler_04
    codes: *fault_codes
  - id: !extend gfa_fehler_05
    codes: *fault_codes
  - id: !extend gfa_fehler_06
    codes: *fault_codes
  - id: !extend gfa_fehler_07
    codes: *fault_codes
  - id: !extend gfa_fehler_08
    codes: *fault_codes
  - id: !extend gfa_fehler_09
    codes: *fault_codes
  - id: !extend gfa_fehler_10
    codes: *fault_codes
  - id: !extend gfa_fehler_11
    codes: *fault_codes
  - id: !extend gfa_fehler_12
    codes: *fault_codes
  - id: !extend gfa_fehler_13
    codes: *fault_codes
  - id: !extend gfa_fehler_14
    codes: *fault_codes
  - id: !extend gfa_fehler_15
    codes: *fault_codes
  - id: !extend gfa_fehler_16
    codes: *fault_codes
  - id: !extend gfa_fehler_17
    codes: *fault_codes
  - id: !extend gfa_fehler_18
    codes: *fault_codes
  - id: !extend gfa_fehler_19
    codes: *fault_codes
  - id: !extend gfa_fehler_20
    codes: *fault_codes
