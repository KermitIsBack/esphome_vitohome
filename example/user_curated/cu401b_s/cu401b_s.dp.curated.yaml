# ---- controls ----
number:
  - platform: vitohome
    id: room_normal
    internal: true
    address: 0x2000
    length: 2
    converter: div10
    min_value: 10
    max_value: 30
    step: 1
  - platform: vitohome
    id: room_reduced
    internal: true
    address: 0x2001
    length: 2
    converter: div10
    min_value: 10
    max_value: 30
    step: 1
  - platform: vitohome
    id: dhw_setpoint
    internal: true
    address: 0x6000
    length: 2
    converter: div10
    min_value: 10
    max_value: 60
    step: 1
  - platform: vitohome
    name: "Heating Curve Inclination"
    icon: mdi:chart-bell-curve-cumulative
    address: 0x2007
    length: 2
    converter: div10
    min_value: 0
    max_value: 1
    step: 0.1
    mode: box
  - platform: vitohome
    name: "Heating Curve Level"
    icon: mdi:temperature-kelvin
    address: 0x2006
    length: 2
    converter: div10
    min_value: -10
    max_value: 10
    step: 1
    mode: box

select:
  - platform: vitohome
    name: "Operating Mode"
    address: 0xB000
    length: 1
    options:
      0: "Shutdown"
      1: "Hot water"
      2: "Heating and hot water"

water_heater:
  - platform: template
    id: wh_hot_water
    name: "Hot Water"
    optimistic: true
    visual:
      min_temperature: 10
      max_temperature: 60
      target_temperature_step: 1
    current_temperature: |-
      if (!id(hot_water_above).has_state()) return {};
      return id(hot_water_above).state;
    target_temperature: |-
      if (!id(dhw_setpoint).has_state()) return {};
      return id(dhw_setpoint).state;
    set_action:
      - if:
          condition:
            lambda: |-
              const float t = id(wh_hot_water).get_target_temperature();
              if (std::isnan(t) || t < 10.0f || t > 60.0f) return false;
              return !id(dhw_setpoint).has_state() || t != id(dhw_setpoint).state;
          then:
            - number.set:
                id: dhw_setpoint
                value: !lambda "return id(wh_hot_water).get_target_temperature();"
  - platform: template
    id: wh_room_normal
    name: "Room Temperature Normal"
    optimistic: true
    visual:
      min_temperature: 10
      max_temperature: 30
      target_temperature_step: 1
    target_temperature: |-
      if (!id(room_normal).has_state()) return {};
      return id(room_normal).state;
    set_action:
      - if:
          condition:
            lambda: |-
              const float t = id(wh_room_normal).get_target_temperature();
              if (std::isnan(t) || t < 10.0f || t > 30.0f) return false;
