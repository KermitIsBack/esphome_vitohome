# Vitocal 222-S (Vitotronic 200 WO1C, device 0x204D) datapoint package; device file: cu401b_s.vitohome.yaml.
# All addresses return plausible values on a 0x204D HW=01 SW=41 unit (2026-10). Writes to 0x6000, 0x2006, 0x2001 and
# 0xB000 were confirmed by controller ACK and read-back; 0x2000 and 0x2007 share the format but were not write-tested.
# The 0x0Exx refrigerant block is not in the Vitosoft CU401B_S catalog (source: openv "Vitocal 200-S (Bj. 2018)").

# 3-byte heat-pump values are a little-endian int16 plus a status byte.
sensor:
  # ---- hydraulics ----
  - platform: vitohome
    id: outside
    name: "Outside Temperature"
    address: 0x0101
    length: 2
    converter: div10
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: flow
    name: "Flow Temperature"
    address: 0x0105
    length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: flow_return
    name: "Flow Return Temperature"
    address: 0x0106
    length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Flow Target Temperature"
    address: 0x1800
    length: 2
    converter: div10
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: hot_water_above
    name: "Hot Water Above Temperature"
    address: 0x010D
    length: 2
    converter: div10
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # ---- refrigerant circuit ----
  - platform: vitohome
    name: "Suction Pressure"
    address: 0xB410
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    signed: false
    update_interval: 20s
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "High Pressure"
    address: 0xB411
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    signed: false
    update_interval: 20s
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: evap
    name: "Evaporating Temperature"
    address: 0x0E10
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: cond
    name: "Condensing Temperature"
    address: 0x0E12
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Suction Gas Temperature"
    address: 0x0E04
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Compressor Suction Temperature"
    address: 0x0E03
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Superheat"
    address: 0x0E08
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Superheat Setpoint"
    address: 0x0E09
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 300s
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    id: discharge
    name: "Discharge Temperature"
    address: 0x0E1B
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    id: liquid
    name: "Liquid Line Temperature"
    address: 0xB404
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  # Gas line at the indoor unit: hot gas in heating/DHW, suction in reverse mode (cooling, defrost). Fault 2C.
  - platform: vitohome
    name: "Gas Line Temperature"
    address: 0x013C
    length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  # Liquid gas sensor on the WPR board (terminals X25.17/X25.18). Fault 2D.
  - platform: vitohome
    name: "Liquid Gas Temperature"
    address: 0x013B
    length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Indoor Evaporator Suction Temperature"
    address: 0x0E52
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 20s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: vitohome
    name: "Inverter IPM Temperature"
    address: 0x0E74
    length: 3
    byte_offset: 0
    byte_length: 2
    converter: div10
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    name: "Compressor Output"
    address: 0xB423
    length: 2
    byte_offset: 0
    byte_length: 1
    converter: noconv
    update_interval: 20s
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
  - platform: vitohome
    name: "Expansion Valve"
    address: 0xB424
    length: 2
    byte_offset: 0
    byte_length: 1
    converter: noconv
    update_interval: 20s
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
  - platform: vitohome
    name: "Outdoor Fan"
    address: 0xB420
    length: 2
    byte_offset: 0
    byte_length: 1
    converter: noconv
    update_interval: 20s
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
  - platform: vitohome
    name: "Secondary Pump"
    address: 0xB421
    length: 2
    byte_offset: 0
    byte_length: 1
    converter: noconv
    update_interval: 20s
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # ---- derived on the device ----
  - platform: template
    name: "Subcooling"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(cond).has_state() || !id(liquid).has_state()) return {};
      return id(cond).state - id(liquid).state;
  - platform: template
    name: "Discharge Superheat"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(discharge).has_state() || !id(cond).has_state()) return {};
      return id(discharge).state - id(cond).state;
  - platform: template
    name: "Evaporator Approach"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(outside).has_state() || !id(evap).has_state()) return {};
      return id(outside).state - id(evap).state;
  # Flow/return split by the 3-way valve; each series only updates while its circuit is served.
  - platform: template
    name: "Heating Flow Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(dhw_charging).has_state() || id(dhw_charging).state || !id(flow).has_state()) return {};
      return id(flow).state;
  - platform: template
    name: "Heating Return Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(dhw_charging).has_state() || id(dhw_charging).state || !id(flow_return).has_state()) return {};
      return id(flow_return).state;
  - platform: template
    name: "Hot Water Flow Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(dhw_charging).has_state() || !id(dhw_charging).state || !id(flow).has_state()) return {};
      return id(flow).state;
  - platform: template
    name: "Hot Water Return Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
      if (!id(dhw_charging).has_state() || !id(dhw_charging).state || !id(flow_return).has_state()) return {};
      return id(flow_return).state;

  # ---- configuration, read-only ----
  - platform: vitohome
    name: "Electric Heater Max Stage"
    address: 0x7907
    length: 1
    converter: noconv
    update_interval: 600s
    entity_category: diagnostic
  - platform: vitohome
    name: "Electric Heater Stage During Utility Lock"
    address: 0x790A
    length: 1
    converter: noconv
    update_interval: 600s
    entity_category: diagnostic
  - platform: vitohome
    name: "Electric Heater Stage 1 Power"
    address: 0x790C
    length: 2
    converter: div10
    update_interval: 600s
    unit_of_measurement: "kW"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    name: "Electric Heater Stage 2 Power"
    address: 0x790D
    length: 2
    converter: div10
    update_interval: 600s
    unit_of_measurement: "kW"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    name: "Hot Gas Temperature Limit"
    address: 0x5095
    length: 2
    converter: div10
    update_interval: 600s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    name: "High Pressure Limit"
    address: 0x5098
    length: 2
    converter: div10
    update_interval: 600s
    unit_of_measurement: "bar"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: vitohome
    name: "Low Pressure Limit"
    address: 0x5099
    length: 2
    converter: div10
    update_interval: 600s
    unit_of_measurement: "bar"
    accuracy_decimals: 1
    entity_category: diagnostic

binary_sensor:
  - platform: vitohome
    id: dhw_charging
    name: "Hot Water Charging"
    address: 0x0494
    length: 1
    bit_mask: 0x01
    update_interval: 20s
  - platform: vitohome
    name: "Defrost Output"
    address: 0xB446
    length: 1
    bit_mask: 0x01
    update_interval: 20s
  - platform: vitohome
    name: "Electric Heater Installed"
    address: 0x7900
    length: 1
    bit_mask: 0x01
    update_interval: 600s
    entity_category: diagnostic
  - platform: vitohome
    name: "Electric Heater For Heating"
    address: 0x7902
    length: 1
    bit_mask: 0x01
    update_interval: 600s
    entity_category: diagnostic
  - platform: vitohome
    name: "Electric Heater For Hot Water"
    address: 0x6015
    length: 1
    bit_mask: 0x01
    update_interval: 600s
    entity_category: diagnostic

text_sensor:
  - platform: vitohome
    type: enum
    name: "Heat Pump State"
    address: 0x130B
    length: 1
    update_interval: 20s
    options:
      0: "Off"
      1: "Prepare"
      2: "Heating"
      3: "Shutdown pause"
      4: "Cooling"
      5: "Defrost preparation"
      6: "Defrosting"
  # 0x2002 belongs to the heating-circuit time program; read-only until its write semantics are known.
  - platform: vitohome
    type: enum
    name: "Room Operating Mode"
    address: 0x2002
    length: 1
    update_interval: 60s
    options:
      0: "Standby"
      1: "Reduced"
      2: "Standard (time program)"
      3: "Fixed value"
  - platform: vitohome
    type: error_history
    name: "Last Message"
    address: 0x0710
    update_interval: 60s
