# Vitocal 222-S (Vitotronic 200 WO1C, device 0x204D HW=01 SW=41), hardware-confirmed 2026-10.
# ESP32-S3 with a CH340 Optolink cable on the S3's native USB-OTG port, driven through usb_uart.
# Datapoints: cu401b_s.dp.curated.yaml.

substitutions:
  device_name: heat-pump-optolink
  friendly_name: Heat Pump
  vitohome_repo: https://github.com/SoulSolistice/esphome_vitohome
  vitohome_ref: main

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# The USB-OTG port carries the Optolink cable, so logs go out on UART0.
logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret esphome-api

ota:
  - platform: esphome
    password: !secret esphome-ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: ${vitohome_repo}
      ref: ${vitohome_ref}
    components: [vitohome]
    refresh: 0s

usb_uart:
  - type: ch340
    channels:
      - id: uart_optolink
        baud_rate: 4800
        data_bits: 8
        parity: EVEN
        stop_bits: 2

vitohome:
  id: vito
  uart_id: uart_optolink
  protocol: P300
  update_interval: 60s
  identify_device: true

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

packages:
  - url: ${vitohome_repo}
    ref: ${vitohome_ref}
    refresh: 0s
    files:
      - example/user_curated/cu401b_s/cu401b_s.dp.curated.yaml
